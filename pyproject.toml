[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dubstitch"
version = "0.1.0"
description = "Dub a short clip into several languages with ElevenLabs, subtitle each version, and stitch them into one video."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cristian Caroli" }]
keywords = ["elevenlabs", "dubbing", "subtitles", "ffmpeg", "yt-dlp"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = ["yt-dlp>=2024.8.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dubstitch = "dubstitch.cli:main"

[tool.setuptools]
packages = ["dubstitch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
